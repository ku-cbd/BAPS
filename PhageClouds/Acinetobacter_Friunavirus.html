                      // hiding the popup through css
                      function hidePopup() {
                          popupTimeout = setTimeout(function () { popup.style.display = 'none'; }, 500);
                      }

		  function showPopup(id) {
		      let dataObj, posCanvas;

		      if (nodes.get(id)) {
			  dataObj = nodes.get(id);
			  posCanvas = network.getPositions([id])[id];
		      } else if (edges.get(id)) {
			  dataObj = edges.get(id);
			  var bbox = network.getBoundingBox(id);
			  posCanvas = {
			      x: (bbox.left + bbox.right) / 2,
			      y: (bbox.top + bbox.bottom) / 2
			  };
		      } else {
			  return;
		      }
		      
		      if (!dataObj.title) return;

		      popup.innerHTML = dataObj.title;
		      
		      var posDOM = network.canvasToDOM(posCanvas);
		      popup.style.display = 'block';
		      popup.style.left = (posDOM.x + 10) + 'px';
		      popup.style.top  = (posDOM.y - 20) + 'px';
		  }
                  


                  
                      network.on("stabilizationProgress", function(params) {
                          document.getElementById('loadingBar').removeAttribute("style");
                          var maxWidth = 496;
                          var minWidth = 20;
                          var widthFactor = params.iterations/params.total;
                          var width = Math.max(minWidth,maxWidth * widthFactor);
                          document.getElementById('bar').style.width = width + 'px';
                          document.getElementById('text').innerHTML = Math.round(widthFactor*100) + '%';
                      });
                      network.once("stabilizationIterationsDone", function() {
                          document.getElementById('text').innerHTML = '100%';
                          document.getElementById('bar').style.width = '496px';
                          document.getElementById('loadingBar').style.opacity = 0;
                          // really clean the dom element
                          setTimeout(function () {document.getElementById('loadingBar').style.display = 'none';}, 500);
			    // hack to stop physics once finished https://github.com/WestHealth/pyvis/issues/88
			  network.setOptions( { physics: false } );

                      });

		  
		  // start block addition
		  

                  return network;

              }
              drawGraph();
        </script>
    
    <div id="info-box" style="position:fixed; top:10px; right:10px; width:300px; background:white; border:1px solid #888; padding:10px; z-index:9999; font-family:Arial;"></div>
    <script type="text/javascript">
    document.addEventListener("DOMContentLoaded", function() {
    network.on("click", function (params) {
    if (params.nodes.length > 0) {
    var nodeId = params.nodes[0];
    var node = nodes.get(nodeId);
    document.getElementById("info-box").innerHTML = node.title || "No info available.";
    } else {
    document.getElementById("info-box").innerHTML = "";
    }
    });
    });
    </script>
