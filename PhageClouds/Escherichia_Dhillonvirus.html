                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {"nodes": {"font": {"size": 0}, "shadow": {"enabled": true}}, "configure": {"enabled": true, "showButton": true}, "edges": {"color": {"inherit": true}, "smooth": false}, "physics": {"enabled": true, "forceAtlas2Based": {"gravitationalConstant": -500, "centralGravity": 0.02, "springLength": 100, "avoidOverlap": 1}, "minVelocity": 0.75, "solver": "forceAtlas2Based"}, "interaction": {"hover": true}};

                  


                  

                  network = new vis.Network(container, data, options);

		  function placePopupAt(domPoint, html) {
		      if (!html) return;
		      popup.innerHTML = html;
		      popup.style.display = 'block';
		      popup.style.left = (domPoint.x + 25) + 'px';
		      popup.style.top  = (domPoint.y - 35) + 'px';
		  }

		  function hidePopupNow() {
		      popup.style.display = 'none';
		  }

		  network.on("hoverNode", function (params) {
		      const n = nodes.get(params.node);
		      if (!n || !n.title) return;
		      placePopupAt(params.pointer.DOM, n.title);
		  });

		  network.on("blurNode", hidePopupNow);

		  network.on("hoverEdge", function (params) {
		      const e = edges.get(params.edge);
		      if (!e || !e.title) return;
		      placePopupAt(params.pointer.DOM, e.title);
		  });

		  network.on("blurEdge", hidePopupNow);
		  
                  

                  

                  
                  // make a custom popup
                      var popup = document.createElement("div");
                      popup.className = 'popup';
                      popupTimeout = null;
                      popup.addEventListener('mouseover', function () {
                          console.log(popup)
                          if (popupTimeout !== null) {
                              clearTimeout(popupTimeout);
                              popupTimeout = null;
                          }
                      });
                      popup.addEventListener('mouseout', function () {
                          if (popupTimeout === null) {
                              hidePopup();
                          }
                      });
                      container.appendChild(popup);



                      // hiding the popup through css
                      function hidePopup() {
                          popupTimeout = setTimeout(function () { popup.style.display = 'none'; }, 500);
                      }

		  function showPopup(id) {
		      let dataObj, posCanvas;

		      if (nodes.get(id)) {
			  dataObj = nodes.get(id);
			  posCanvas = network.getPositions([id])[id];
		      } else if (edges.get(id)) {
			  dataObj = edges.get(id);
			  var bbox = network.getBoundingBox(id);
			  posCanvas = {
			      x: (bbox.left + bbox.right) / 2,
			      y: (bbox.top + bbox.bottom) / 2
			  };
		      } else {
			  return;
		      }
		      
		      if (!dataObj.title) return;

		      popup.innerHTML = dataObj.title;
		      
		      var posDOM = network.canvasToDOM(posCanvas);
		      popup.style.display = 'block';
		      popup.style.left = (posDOM.x + 10) + 'px';
		      popup.style.top  = (posDOM.y - 20) + 'px';
		  }
                  


                  
		  network.on("stabilizationIterationsDone", function() {
                      network.setOptions( { physics: false } );
		  });
		  //end block addition
		  
                  

                  return network;

              }
              drawGraph();
        </script>
    
    <div id="info-box" style="position:fixed; top:10px; right:10px; width:300px; background:white; border:1px solid #888; padding:10px; z-index:9999; font-family:Arial;"></div>
    <script type="text/javascript">
    document.addEventListener("DOMContentLoaded", function() {
    network.on("click", function (params) {
    if (params.nodes.length > 0) {
    var nodeId = params.nodes[0];
    var node = nodes.get(nodeId);
    document.getElementById("info-box").innerHTML = node.title || "No info available.";
    } else {
    document.getElementById("info-box").innerHTML = "";
    }
    });
    });
    </script>
